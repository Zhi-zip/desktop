name: Build Zhi-zip

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
           # Artifact
          - os: windows-latest
            artifact: Zhi-zip-windows
            file: Zhi-windows.zip
          - os: ubuntu-22.04
            artifact: Zhi-zip-linux
            file: Zhi-linux.tar.gz
          - os: macos-latest
            artifact: Zhi-zip-macos
            file: Zhi-macos.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux system libs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libdbus-1-3 libfontconfig1 libxrender1 libxi6 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 \
            tk

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install PySide6
          pip install pyinstaller

      - name: Build Windows
        if: runner.os == 'Windows'
        run: pyinstaller --noconfirm --onedir --windowed --name Zhi --collect-all jieba --hidden-import rapidfuzz Zhi-zip.py

      - name: Build macOS
        if: runner.os == 'macOS'
        run: pyinstaller --noconfirm --onedir --windowed --name Zhi --osx-bundle-identifier com.zhi.app --collect-all jieba --hidden-import rapidfuzz Zhi-zip.py

      - name: Build Linux
        if: runner.os == 'Linux'
        run: pyinstaller --noconfirm --onedir --name Zhi --collect-all jieba --hidden-import rapidfuzz Zhi-zip.py

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\Zhi -DestinationPath Zhi-windows.zip

      - name: Package macOS
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/Zhi.app Zhi-macos.zip

      - name: Package Linux
        if: runner.os == 'Linux'
        run: tar -czf Zhi-linux.tar.gz -C dist Zhi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.file }}
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
